services:
  kong-db:
    image: postgres:16-alpine
    container_name: kong-db
    restart: on-failure
    networks:
      - kong-net
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-postgres-data:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong/kong-gateway:3.6.0.0
    container_name: kong-migrations
    command: kong migrations bootstrap
    restart: on-failure
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    networks:
      - kong-net

  kong:
    image: kong/kong-gateway:3.6.0.0
    container_name: kong_api_gateway
    restart: always
    networks:
      - kong-net
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8444:8444"
      - "8001:8001"
    environment:
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 # Proxy SSL
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 # Admin SSL
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:z

networks:
  kong-net:
    driver: bridge

volumes:
  kong-postgres-data:
